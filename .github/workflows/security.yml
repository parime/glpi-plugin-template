# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security).
# À rendre obligatoire dans la protection de la branche principale.
name: Sécurité

on:
  # Push : seulement les branches principales ; les branches de travail sont contrôlées par leur
  # PR. Évite deux exécutions (et deux notifications d'échec) pour chaque commit d'une PR.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.12.1
    with:
      plugin-key: monplugin
      # Pas de passe des tests d'intégration en français : la suite du modèle n'a que des tests
      # unitaires, sans GLPI ni base (phpunit.xml.dist), lancés par ci.yml avec un PHPUnit global ;
      # un plugin créé depuis le modèle retire cette ligne dès qu'il a une suite d'intégration.
      integration-languages: '[]'
      # Jeu de données créé avant la désinstallation (facultatif, conseillé dès qu'il existe) :
      # seed-command: php plugins/monplugin/tests/security/setup.php
      # Test de mise à jour depuis la dernière release (GLPI 11 et 12), actif par défaut :
      # upgrade-test: false pour le désactiver, upgrade-seed-command pour un autre jeu de données.
      # Parcours de toutes les pages (GLPI 11 et 12), actif par défaut : pages-test: false pour le
      # désactiver, pages-mode: warning le temps d'une issue de correction, pages-accounts pour
      # d'autres comptes que glpi et tech.
