# Contrôles de sécurité communs à tous les plugins GLPI (parime/glpi-plugin-security).
# À rendre obligatoire dans la protection de la branche principale.
name: Sécurité

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    uses: parime/glpi-plugin-security/.github/workflows/plugin-security.yml@v1.0.1
    with:
      plugin-key: monplugin
      # Jeu de données créé avant la désinstallation (facultatif, conseillé dès qu'il existe) :
      # seed-command: php plugins/monplugin/tests/security/setup.php
